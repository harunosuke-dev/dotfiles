# tmux の設定。
# ペイン操作とコピーモードを Vim に寄せた構成
# （元は Daniel Thau 氏の vim-keys.conf, public domain）

# --- 過去のバインドの掃除 --- #
# source-file は追加と上書きしかしない。この設定から消したバインドは
# prefix + r で読み直しても生き残るため、ここで明示的に外す。
#
# unbind -a は使わない。tmux 既定の85キー（prefix の c / z / n / p / d / x /
# 数字 / [ / ] など）まで巻き添えで消える。
# -q は「そのキーが無い」エラーを黙らせる。新しいサーバーでも通る
unbind -q C-e   # lf の popup。lf ごと廃止した
unbind -q C-f   # tmux-sessionizer。C-o へ移した
unbind -q C-p   # paste-buffer。クリップボードから普通に貼れる

# --- prefix --- #
# 既定の C-b から C-t へ移した。C-o は nvim のジャンプリストを戻るキーと衝突する
# send-prefix を張ってあるので、リテラルの C-t が要る時は2回押す
set -g prefix C-t
unbind C-b
bind -N "リテラルの C-t を送る" C-t send-prefix

# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
bind -N "🎯 [VIM-LIKE] 左右に分割" v split-window -h
bind -N "🎯 [VIM-LIKE] 上下に分割" s split-window -v

bind -N "🎯 左右に分割（仕切りが縦）" | split-window -h
bind -N "🎯 上下に分割（仕切りが横）" - split-window -v
# | は Shift が要るので、同じ位置の \ でも左右に分割できるようにする
bind -N "🎯 左右に分割（仕切りが縦）" '\' split-window -h

bind -N "🎯 左右に分割" C-\\ split-window -h
bind -N "🎯 上下に分割" C-- split-window -v
bind -N "🎯 上下に分割" C-\_ split-window -v

# ペインの移動。
#
# 日本語入力モードでは、Ctrl を離した直後のキーが IME に食われて tmux に
# 届かない（C-t h の h が「変換待ち」になってしまう）。Ctrl を押したままの
# 組み合わせは IME を素通りするため、C-h/C-j/C-k/C-l を主に使う。
# -r 付きなので prefix を押し直さずに移動を続けられる
#
bind -r -N "🎯 [VIM-LIKE] 移動: 左" C-h if -F '#{pane_at_left}'   '' 'select-pane -L'
bind -r -N "🎯 [VIM-LIKE] 移動: 下" C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -r -N "🎯 [VIM-LIKE] 移動: 上" C-k if -F '#{pane_at_top}'    '' 'select-pane -U'
bind -r -N "🎯 [VIM-LIKE] 移動: 右" C-l if -F '#{pane_at_right}'  '' 'select-pane -R'
# 英数モード用。動作は上と同じ
bind -N "🎯 [VIM-LIKE] Select pane left"  h if -F '#{pane_at_left}'   '' 'select-pane -L'
bind -N "🎯 [VIM-LIKE] Select pane down"  j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -N "🎯 [VIM-LIKE] Select pane up"    k if -F '#{pane_at_top}'    '' 'select-pane -U'
bind -N "🎯 [VIM-LIKE] Select pane right" l if -F '#{pane_at_right}'  '' 'select-pane -R'

# ペインの移動は上の prefix + hjkl のみ。Alt 系は割り当てない。
#
# ペインのサイズ変更。移動が h j k l なので、大文字を対応させる。
#
# 左右の幅調整だけは Ctrl+[ ] でも行える。括弧の形が広げる／狭める向きに
# 対応していて分かりやすく、Ctrl を離さないので日本語入力モードでも通る。
# C-[ は本来 Escape と同じ 0x1b だが、extended-keys により区別できる
bind -r -N "🎯 幅を狭める" C-[ resize-pane -L 3
bind -r -N "🎯 幅を広げる" C-] resize-pane -R 3

bind -r -N "🎯 [VIM-LIKE] サイズ変更: 左" H resize-pane -L 3
bind -r -N "🎯 [VIM-LIKE] サイズ変更: 下" J resize-pane -D 3
bind -r -N "🎯 [VIM-LIKE] サイズ変更: 上" K resize-pane -U 3
bind -r -N "🎯 [VIM-LIKE] サイズ変更: 右" L resize-pane -R 3

# Reload config file
bind -N "⚡ [CUSTOM] Reload tmux config" r source-file "$XDG_CONFIG_HOME"/tmux/tmux.conf \; display "tmux.conf reloaded!"

# vi-style controls for copy mode
setw -g mode-keys vi

# コピーモード中だけカーソルをブロックにする。vi のノーマルモードと揃える。
set-hook -g pane-mode-changed 'if -F "#{pane_in_mode}" "setw cursor-style block" "setw cursor-style default"'

# 'v' で選択を始める
bind -T copy-mode-vi v send -X begin-selection

# 'V' で行選択
bind -T copy-mode-vi V send -X select-line

# 'C-v' で矩形選択
bind -T copy-mode-vi C-v send -X rectangle-toggle

# 'y' でヤンク: "pbcopy" is for Mac/Linux, "xsel -bi" is for Win
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel -bi"
# bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xsel -bi"

# 'Y' で行ヤンク
bind -T copy-mode-vi Y send -X copy-line

# --- popup --- #
# 位置と大きさの計算は packages/tmux/bin/tmux-popup にまとめてある。
#
#   full    腰を据えて作業するもの。ステータスラインの下を全部使う
#   center  選んで消えるもの。中央に 90%。fzf のピッカーと同じ見た目
#
# 色はペインの元のアクティブ色。枠線は fzf の border と揃えてある
# set -g popup-style 'bg=#07080d'
set -g popup-style 'bg=default' # default設定にしてghostyの背景透過を有効化する
set -g popup-border-style 'fg=#444d56,bg=#07080d'

# --- lazygit --- #
bind -N "🔧 [POPUP] Open git client (lazygit)" C-g \
  run-shell -b '~/.local/bin/tmux-popup full lazygit'

# --- 名前付きウィンドウ --- #
# 同じキーで行き来する。処理は packages/tmux/bin/tmux-window-toggle にまとめてある。
# dev は起動コマンドを渡さないので、開発サーバーなど何を走らせてもよい場所になる
bind-key -N "🤖 Toggle Claude window" C-c \
  run-shell -b '~/.local/bin/tmux-window-toggle claude claude'
bind-key -N "🚀 Toggle dev window" C-b \
  run-shell -b '~/.local/bin/tmux-window-toggle dev'

# --- tmux-sessionizer --- #
# C-f ではなく C-o なのは zsh 側と同じ文字に揃えるため。
# あちらは Ctrl+F が emacs の forward-char で譲れない。
# popup を開くだけなので -r（連打）は付けない
bind-key -N "🔧 [POPUP] Create/switch session" C-o \
  run-shell -b '~/.local/bin/tmux-popup center ~/.local/bin/tmux-sessionizer-popup'

# --- セッション管理 --- #
# 標準の prefix + d に加えて prefix + C-d でも切り離せるようにする。
bind-key -N "🔌 Detach client" C-d detach-client
bind-key -N "🔧 [POPUP] Kill session" C-x \
  run-shell -b '~/.local/bin/tmux-popup center ~/.local/bin/tmux-kill-session'
bind-key -N "🔧 [POPUP] Switch session" C-s \
  run-shell -b '~/.local/bin/tmux-popup center ~/.local/bin/tmux-switch-session'
# 任意の名前で新規セッションを作成（現在のディレクトリで開始）
bind-key -N "🆕 New named session" C-n command-prompt -p "New session:" "new-session -c '#{pane_current_path}' -s '%%'"
# 元の新ウィンドウ版（バックアップ）
# bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# 基本設定
## tmux 内側の TERM。screen-256color だと nvim が必要とする機能が不足する
set -g default-terminal "tmux-256color"

if -F '#{!=:#{@terminal_features_set},1}' {
  set -as terminal-features ',alacritty:RGB'         # 24bit カラー（カラースキームの色を落とさない）
  set -as terminal-features ',alacritty:usstyle'     # 下線スタイル（nvim の診断の波線）
  set -as terminal-features ',xterm-ghostty:RGB'     # Ghostty は TERM=xterm-ghostty になる
  set -as terminal-features ',xterm-ghostty:usstyle'
  set -as terminal-features ',xterm-ghostty:extkeys'  # 拡張キー（下の extended-keys で使う）
  set -g @terminal_features_set 1
}

## 拡張キープロトコル
set -s extended-keys on
## ウィンドウのフォーカス変化を nvim へ伝える（FocusGained/FocusLost）。
## 外部でファイルが変わった時の自動再読込や gitsigns の更新に必要
set -g focus-events on
## ペインやウィンドウを切り替えた後、IME を英数へ戻す。
## 日本語モードのまま操作したい場合は Ctrl を離さない（C-t C-h など）
if-shell 'command -v macism' {
  set-hook -g after-select-pane   'run-shell -b "macism com.apple.keylayout.ABC"'
  set-hook -g after-select-window 'run-shell -b "macism com.apple.keylayout.ABC"'
  set-hook -g after-split-window  'run-shell -b "macism com.apple.keylayout.ABC"'
}
## Escキーの遅延を解消
set -s escape-time 0
set -g display-time 2000
## ウィンドウ名の自動更新
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
## その他のちらつき軽減設定
set -g visual-activity off
set -g visual-bell off
## status line を更新する間隔を60秒にする（ちらつき軽減）
set-option -g status-interval 60
## スクロールバックの行数。既定の 2000 行ではビルドログですぐ溢れる
set -g history-limit 50000
## ウィンドウを閉じた時に番号を振り直す。
## 既定では 1, 2, 4 のように穴が空き、prefix + 数字での移動とずれる
set -g renumber-windows on
## ウィンドウのインデックスを1から始める
set -g base-index 1
## ペインのインデックスを1から始める
setw -g pane-base-index 1
# マウス操作を有効にする
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
## ペインの中身の背景色。
set -g window-style 'bg=terminal,fg=#979ea9'  # 非アクティブなペイン（透過）
set -g window-active-style 'bg=terminal'      # アクティブなペイン（透過）
## アクティブの区別は下の pane-border-status が担う
set -g pane-border-indicators colour
setw -g pane-border-style 'fg=#444d56'         # 非アクティブ。ポップアップの枠と同じ色
setw -g pane-active-border-style 'fg=#abb2bf'  # アクティブ。Ghostty の foreground と同じ白
setw -g pane-border-status top
setw -g pane-border-format '  #{pane_index}: #{pane_current_path} | #[fg=#7d8296]#{?#{m:[0-9]*.[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}#[default]  '

## zoom 中は見出し行を消す
set-hook -g window-layout-changed 'if -F "#{window_zoomed_flag}" "setw pane-border-status off" "setw -u pane-border-status"'

### status lineの設定 ###
set -g status-position "top"
# ## window-status を中央揃えで配置する
set-option -g status-justify "centre"
# ## status line の背景色を指定する。
set-option -g status-bg "colour236"
# ## status line の文字色を指定する。
set-option -g status-fg "colour255"

# ---- left ---- #
set-option -g status-left-length 100
set-option -g status-left "#[fg=colour255 bg=colour236] Session: #I.#P  #S #[default] "
# set-option -g status-left " #S:#I.#P "

# ---- center ---- #
setw -g window-status-current-format '\
#[fg=colour236]#[bg=colour236] #[bg=colour236]#[fg=colour119]\
#I#[fg=colour236]:#[fg=colour255]#W#[fg=colour249]\
#F#[fg=colour236]#[bg=colour236]'

setw -g window-status-format ' #I#[fg=colour236]:#[fg=colour250]#W#[fg=colour244]#F '

# ---- right ---- #
set -g status-right-length 80
set -g status-right \
    "#{?client_prefix,#[reverse],}""\
""#[fg=colour255,bg=colour236] %Y/%m/%d(%a)""

