disableStartupPopups: true
quitOnTopLevelReturn: true
promptToReturnFromSubprocess: false
notARepository: skip
git:
  autoFetch: false
  disableForcePushing: true
  parseEmoji: true
  pagers:
    - colorArg: always
      pager: delta --paging=never
  log:
    showGraph: always
gui:
  showRandomTip: false
  showIcons: false
  theme:
    activeBorderColor:
      - "#6DB3D4" # Muted soft blue
    inactiveBorderColor:
      - "#6A7580" # Muted gray
    optionsTextColor:
      - "#8FA8B2" # Soft blue-gray
    selectedLineBgColor:
      - "#1A1F24" # Very subtle dark background
    selectedRangeBgColor:
      - "#1A1F24" # Same as selected line
    cherryPickedCommitBgColor:
      - "#181C21" # Minimal background
    cherryPickedCommitFgColor:
      - "#7A9FC7" # Muted blue
    unstagedChangesColor:
      - "#C97064" # Muted red
    # Soft, muted colors for low contrast
    defaultFgColor:
      - "#B8BCC8" # Soft light gray
    searchingActiveBorderColor:
      - "#C6A86D" # Muted yellow
    # Very soft diff colors
    addedBgColor:
      - default # No background color
    addedFgColor:
      - "#7A9A7A" # Muted green
    deletedBgColor:
      - default # No background color
    deletedFgColor:
      - "#C97064" # Muted red
    modifiedBgColor:
      - default # No background color
    modifiedFgColor:
      - "#C6A86D" # Muted yellow
os:
  # lazygit の中で e / o を押した時。
  #
  # nvim の中から起動した場合（$NVIM に RPC ソケットが入る）は、nvim 側の
  # 関数を1回呼ぶだけにする。そこで lazygit を畳み、起動したペインへ戻り、
  # ファイルを開く。この3つを分けて送ると非同期で順番が狂い、
  # フォーカスだけ移って lazygit が開いたまま残る。
  #
  # 既定の `nvim` では lazygit の端末の中に入れ子の nvim が立ち上がり、
  # 親には届かない。
  #
  # 窓を覚えているのは nvim 側（lua/config/lazygit.lua）。
  # require の引数に Lua の長括弧を使うのは、YAML を単一引用符で囲むため
  open: 'if [ -z "$NVIM" ]; then nvim -- {{filename}}; else nvim --server "$NVIM" --remote-send "<Cmd>lua require[[config.lazygit]].edit([[{{filename}}]])<CR>"; fi'
  edit: 'if [ -z "$NVIM" ]; then nvim -- {{filename}}; else nvim --server "$NVIM" --remote-send "<Cmd>lua require[[config.lazygit]].edit([[{{filename}}]])<CR>"; fi'
  editAtLine: 'if [ -z "$NVIM" ]; then nvim +{{line}} -- {{filename}}; else nvim --server "$NVIM" --remote-send "<Cmd>lua require[[config.lazygit]].edit([[{{filename}}]], [[{{line}}]])<CR>"; fi'

# keybinding:
#   commits:
#     viewResetOptions: G

# ステージ済みの変更を Conventional Commits 形式でコミットする：
# files パネルで c -> type選択 -> scope(任意) -> 件名
#
# 既定の c（コミット欄）を置き換えている
# 本文が要る時は C でエディタを開いて書く
customCommands:
  - key: "c"
    context: "files"
    description: "Conventional commit (type/scope/件名)"
    prompts:
      - type: "menu"
        title: "type を選択"
        options:
          - {name: "feat:     提供物の追加", value: "feat"}
          - {name: "fix:      不具合修正", value: "fix"}
          - {name: "ui:       デザインの追加・変更", value: "ui"}
          - {name: "refactor: 内部整理", value: "refactor"}
          - {name: "docs:     ドキュメント", value: "docs"}
          - {name: "style:    コード整形", value: "style"}
          - {name: "chore:    上記以外", value: "chore"}
      - type: "input"
        title: "scope（任意・決められた規約があればそれに準拠）"
      - type: "input"
        title: "件名"
        # 「type(scope): 」を最初から入れて、続けて件名を打つ。scopeが空なら括弧なし。
        initialValue: "{{index .PromptResponses 0}}{{if index .PromptResponses 1}}({{index .PromptResponses 1}}){{end}}: "
    command: "git commit -e -m {{index .PromptResponses 2 | quote}}"
    loadingText: "committing..."
    output: terminal
